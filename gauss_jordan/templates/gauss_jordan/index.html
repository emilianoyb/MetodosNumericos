<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gauss-Jordan · Resolutor de sistemas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('gauss_jordan.static', filename='style.css') }}">
</head>
<body>

<div class="hoja">

    <a href="{{ url_for('menu') }}" style="display:inline-block;margin-bottom:12px;color:#8a8a8a;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:13px;">&larr; Menú de proyectos</a>

    <header class="encabezado">
        <h1>Eliminación de Gauss Jordan</h1>
        <p class="subtitulo">Arma un sistema de <em>n</em> ecuaciones con <em>n</em> incógnitas y observa cada operación de fila hasta llegar a la solución.</p>
    </header>

    <section class="panel-config">
        <div class="campo-n">
            <label for="n">Número de incógnitas</label>
            <div class="control-n">
                <button type="button" id="btn-menos" aria-label="Reducir">&minus;</button>
                <input type="number" id="n" value="3" min="2" max="8">
                <button type="button" id="btn-mas" aria-label="Aumentar">&plus;</button>
            </div>
        </div>
        <div class="acciones-config">
            <button type="button" id="btn-generar" class="btn-primario">Generar matriz</button>
            <button type="button" id="btn-ejemplo" class="btn-fantasma">Cargar ejemplo</button>
            <button type="button" id="btn-limpiar" class="btn-fantasma">Limpiar celdas</button>
        </div>
    </section>

    <section class="panel-matriz">
        <div class="matriz-envoltura">
            <svg class="bracket bracket-izq" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M18,2 Q4,2 4,20 L4,80 Q4,98 18,98" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            <div id="matriz-inputs" class="matriz-grid"></div>
            <svg class="bracket bracket-der" viewBox="0 0 20 100" preserveAspectRatio="none"><path d="M2,2 Q16,2 16,20 L16,80 Q16,98 2,98" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </div>
        <p class="pista">Las últimas columnas (resaltadas) son los términos independientes.</p>

        <button type="button" id="btn-resolver" class="btn-primario btn-resolver">Resolver sistema</button>
        <p id="mensaje-error" class="mensaje-error" hidden></p>
    </section>

    <section id="panel-resultado" class="panel-resultado" hidden>

        <div class="bloque-solucion">
            <p class="eyebrow">Solución</p>
            <ul id="lista-solucion" class="lista-solucion"></ul>
        </div>
    </section>

</div>

<script>
  window.RESOLVER_URL = "{{ url_for('gauss_jordan.resolver') }}";
</script>
<script src="{{ url_for('gauss_jordan.static', filename='app.js') }}"></script>
</body>
</html>
